---
# tasks file for role_k8s

- name: Install prerequisites
  ansible.builtin.include_tasks: common/prerequisites.yml

- name: Setup Kubernetes Binaries
  ansible.builtin.include_tasks: "{{ kubernetes_setup_type }}/main.yml"

- name: Find the hostname where kubernetes_cluster_init_master is true
  ansible.builtin.set_fact:
    init_master_candidates: "{{ init_master_candidates | default([]) + [inventory_hostname] }}"
  when: 
    - kubernetes_cluster_init_master is defined
    - kubernetes_cluster_init_master | bool
  run_once: true
  delegate_to: localhost
  delegate_facts: true

- name: Set init master node fact on localhost
  ansible.builtin.set_fact:
    init_master_node: "{{ hostvars | dict2items | 
                         selectattr('value.init_master_candidates', 'defined') | 
                         map(attribute='key') | 
                         first | 
                         default(groups['master'] | first) }}"
  run_once: true
  delegate_to: localhost
  delegate_facts: true

- name: Distribute init master node fact to all hosts
  ansible.builtin.set_fact:
    init_master_node: "{{ hostvars['localhost'].init_master_node }}"


# check node already joined cluster
- name: Check node joined status
  block:
    - name: Check node has already joined the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/.initialized
      register: node_initialized_check

    - name: Set fact about node join status
      ansible.builtin.set_fact:
        node_already_joined: "{{ node_initialized_check.stat.exists }}"

    - name: Display node join status
      ansible.builtin.debug:
        msg: "Node already joined: {{ node_already_joined | bool |upper }}"


# initialize kubernetes cluster
- name: Kubernetes cluster initialization
  when:
    - inventory_hostname == init_master_node
    - not node_already_joined
  block:
    - name: Pull required container images
      ansible.builtin.include_tasks: kubeadm/pull.yml

    - name: Initialize master node
      ansible.builtin.include_tasks: kubeadm/init.yml

    - name: Deploy cluster networking plugin
      ansible.builtin.include_tasks: kubeadm/network/{{ kubernetes_cluster_pod_network_type }}/main.yml

    - name: Check master node status
      ansible.builtin.include_tasks: kubeadm/status.yml
      loop: "{{ [init_master_node] }}"
      loop_control:
        loop_var: status_host
        label: "{{ status_host }}"
      vars:
        check_hostname: "{{ status_host }}"
      run_once: true

    - name: Create .kube directory for the current user
      ansible.builtin.include_tasks: kubeadm/dirs.yml

    - name: Create initialization marker file
      ansible.builtin.include_tasks: kubeadm/marker.yml


# join nodes to kubernetes cluster
- name: Join nodes to Kubernetes cluster
  when:
    - inventory_hostname != init_master_node
    - not node_already_joined
  block:
    - name: Generate join token on init master node for other nodes to join
      ansible.builtin.include_tasks: kubeadm/token.yml

    - name: Join nodes to Kubernetes cluster
      ansible.builtin.include_tasks: kubeadm/join.yml

    - name: Check node status
      ansible.builtin.include_tasks: kubeadm/status.yml
      loop: "{{ groups['master'] + groups['worker'] | default([]) }}"
      loop_control:
        loop_var: status_host
        label: "{{ status_host }}"
      vars:
        check_hostname: "{{ status_host }}"
      run_once: true

    - name: Create .kube directory for the current user
      ansible.builtin.include_tasks: kubeadm/dirs.yml
      when:
        - inventory_hostname in groups['master']

    - name: Create initialization marker file
      ansible.builtin.include_tasks: kubeadm/marker.yml
