---
# tasks file for role_k8s

- name: Install prerequisites
  ansible.builtin.include_tasks: common/prerequisites.yml
  tags:
    - k8s
    - k8s-common

- name: Gather facts from all cluster nodes
  ansible.builtin.setup:
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['k8s_master'] + groups['k8s_worker'] }}"
  run_once: true
  tags:
    - k8s
    - k8s-common

- name: Get current node hostname for consistent node naming
  ansible.builtin.command: hostname
  register: node_hostname_result
  become: true
  tags:
    - k8s
    - k8s-common

- name: Set node hostname
  ansible.builtin.set_fact:
    node_hostname: "{{ node_hostname_result.stdout }}"
  tags:
    - k8s
    - k8s-common

- name: Find init master node directly
  ansible.builtin.set_fact:
    init_master_node: >-
      {{
        groups['all'] | 
        map('extract', hostvars) |
        selectattr('kubernetes_cluster_init_master', 'defined') |
        selectattr('kubernetes_cluster_init_master', 'equalto', true) |
        map(attribute='inventory_hostname') |
        list | first | default(groups['k8s_master'][0])
      }}
  run_once: true
  delegate_to: localhost
  delegate_facts: true
  tags:
    - k8s
    - k8s-common

- name: Distribute init master node fact to all hosts
  ansible.builtin.set_fact:
    init_master_node: "{{ hostvars['localhost'].init_master_node }}"
  tags:
    - k8s
    - k8s-common

- name: Check if node already joined cluster
  tags:
    - k8s
    - k8s-common
    - k8s-join-status
  block:
    - name: Check node has already joined the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/.initialized
      register: node_initialized_check

    - name: Set fact about node join status
      ansible.builtin.set_fact:
        node_already_joined: "{{ node_initialized_check.stat.exists }}"

    - name: Display node join status
      ansible.builtin.debug:
        msg: "Node already joined: {{ node_already_joined | bool |upper }}"


# Setup Kubernetes Binaries
- name: Setup Kubernetes Binaries
  ansible.builtin.include_tasks: "binary/main.yml"
  tags:
    - k8s
    - k8s-binary


# Initialize Kubernetes cluster
- name: Kubernetes cluster initialization
  tags:
    - k8s
    - k8s-init
  when:
    - inventory_hostname == init_master_node
    - not node_already_joined
  run_once: true
  block:
    - name: Pull required container images
      ansible.builtin.include_tasks: kubeadm/pull.yml
      run_once: true

    - name: Initialize master node
      ansible.builtin.include_tasks: kubeadm/init.yml
      run_once: true

    - name: Create .kube directory for the current user
      ansible.builtin.include_tasks: kubeadm/dirs.yml

    - name: Deploy cluster networking plugin
      ansible.builtin.include_tasks: kubeadm/network/{{ kubernetes_cluster_pod_network_type }}/main.yml
      run_once: true

    - name: Check core cluster pods Health
      ansible.builtin.include_tasks: kubeadm/health_core.yml
      run_once: true

    - name: Check init master node status
      ansible.builtin.include_tasks: kubeadm/node_status.yml
      vars:
        status_message: "has been successfully initialized the cluster"
      run_once: true

    - name: Save image list
      ansible.builtin.include_tasks: kubeadm/image.yml

    - name: Initialize Kubernetes cluster
      ansible.builtin.include_tasks: kubeadm/marker/init.yml

    - name: Create version marker file
      ansible.builtin.include_tasks: kubeadm/marker/version.yml


# Join nodes to Kubernetes cluster
- name: Join nodes to Kubernetes cluster
  tags:
    - k8s
    - k8s-join
  when:
    - inventory_hostname != init_master_node
    - not node_already_joined
    - node_hostname not in (kubernetes_retired_nodes | default([]) | map(attribute='hostname') | list)
  block:
    - name: Generate join token on init master node for other nodes to join
      ansible.builtin.include_tasks: kubeadm/token.yml

    - name: Join nodes to Kubernetes cluster
      ansible.builtin.include_tasks: kubeadm/join.yml

    - name: Create .kube directory for the current user
      ansible.builtin.include_tasks: kubeadm/dirs.yml
      when:
        - inventory_hostname in groups['k8s_master']

    - name: Check current node status
      ansible.builtin.include_tasks: kubeadm/node_status.yml
      vars:
        status_message: "has been successfully joined the cluster"

    - name: Join new node to Kubernetes cluster
      ansible.builtin.include_tasks: kubeadm/marker/init.yml

    - name: Create version marker file
      ansible.builtin.include_tasks: kubeadm/marker/version.yml


# Check Cluster version and upgrade requirements
- name: Check cluster version and upgrade requirements
  tags:
    - k8s
    - k8s-upgrade
  when:
    - node_already_joined
    - node_hostname not in (kubernetes_retired_nodes | default([]) | map(attribute='hostname') | list)
  block:
    - name: Check if version file exists
      ansible.builtin.stat:
        path: /etc/kubernetes/.version
      register: version_file_check

    - name: Read current cluster version
      ansible.builtin.slurp:
        src: /etc/kubernetes/.version
      register: current_version_content
      when: version_file_check.stat.exists

    - name: Set current cluster version fact
      ansible.builtin.set_fact:
        current_cluster_version: "{{ current_version_content.content | b64decode | trim }}"
      when: version_file_check.stat.exists

    - name: Set current cluster version to unknown if file doesn't exist
      ansible.builtin.set_fact:
        current_cluster_version: "unknown"
      when: not version_file_check.stat.exists

    - name: Display current and target versions
      ansible.builtin.debug:
        msg: |
          Current cluster version: {{ current_cluster_version }}
          Target cluster version: {{ kubernetes_cluster_config_kubernetes_version }}

    - name: Determine if upgrade is needed
      ansible.builtin.set_fact:
        upgrade_needed: "{{ current_cluster_version != 'unknown' and 
                           current_cluster_version is version(kubernetes_cluster_config_kubernetes_version, '<') }}"

    - name: Display upgrade decision
      ansible.builtin.debug:
        msg: "Upgrade needed: {{ upgrade_needed | bool | upper }}"

    - name: Validate upgrade path
      ansible.builtin.include_tasks: common/upgrade_validation.yml
      when: upgrade_needed | default(false)


# Upgrade Kubernetes Cluster
# https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
# https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/upgrading-linux-nodes/
- name: Upgrade Kubernetes cluster
  tags:
    - k8s
    - k8s-upgrade
  when:
    - node_already_joined
    - upgrade_needed | default(false)
    - node_hostname not in (kubernetes_retired_nodes | default([]) | map(attribute='hostname') | list)
  block:
    - name: Check cluster health before upgrade
      delegate_to: "{{ init_master_node }}"
      when: inventory_hostname in groups['k8s_master']
      block:
        - name: Verify API server connectivity
          ansible.builtin.command: kubectl cluster-info
          register: cluster_info
          retries: "{{ kubernetes_kubeadm_retry }}"
          delay: "{{ kubernetes_kubeadm_delay }}"
          until: cluster_info.rc == 0

        - name: Check if kubectl is working
          ansible.builtin.command: kubectl get nodes
          register: kubectl_check
          changed_when: false
          failed_when: kubectl_check.rc != 0

    - name: Upgrade init master node
      ansible.builtin.include_tasks: kubeadm/upgrade/init_master.yml
      when:
        - inventory_hostname == init_master_node
        - inventory_hostname in groups['k8s_master']

    - name: Check core cluster pods Health
      ansible.builtin.include_tasks: kubeadm/health_core.yml
      run_once: true
      when:
        - inventory_hostname == init_master_node
        - inventory_hostname in groups['k8s_master']

    - name: Upgrade other master nodes
      ansible.builtin.include_tasks: kubeadm/upgrade/other_master.yml
      when:
        - inventory_hostname != init_master_node
        - inventory_hostname in groups['k8s_master']

    - name: Upgrade worker nodes
      ansible.builtin.include_tasks: kubeadm/upgrade/worker.yml
      when: inventory_hostname in groups['k8s_worker'] | default([])

    - name: Check node status after upgrade
      ansible.builtin.include_tasks: kubeadm/node_status.yml
      vars:
        status_message: "has been successfully upgraded"

    - name: Update version file after upgrade on the nodes
      ansible.builtin.include_tasks: kubeadm/marker/version.yml

    - name: Post-upgrade verification on init master node
      ansible.builtin.include_tasks: kubeadm/upgrade/post_tasks.yml
      when: inventory_hostname == init_master_node
      run_once: true


# Remove Node from Cluster
- name: Remove node from cluster
  tags:
    - k8s
    - k8s-remove
  when:
    - inventory_hostname == init_master_node
  block:
    - name: Remove nodes from Kubernetes cluster
      ansible.builtin.include_tasks: kubeadm/remove.yml
      loop: "{{ kubernetes_retired_nodes}}"
      loop_control: 
        loop_var: node
      when:
        - kubernetes_retired_nodes is defined
        - kubernetes_retired_nodes | length > 0


# Deploy Helm Charts
- name: Deploy Helm Charts
  tags:
    - helm
    - helm-deploy
  when:
    - inventory_hostname == init_master_node
  block:
    - name: Deploy Helm-based components
      ansible.builtin.include_tasks: kubeadm/helm/main.yml
      run_once: true
      when: helm_charts | length > 0


# Notift kubelet restart
- name: Notify kubelet restart after kubelet-csr-approver installation
  tags:
    - helm
    - helm-restart-kubelet
  ansible.builtin.debug:
    msg: "Triggering kubelet restart due to kubelet-csr-approver installation"
  notify: restart kubelet
  when: 
    - helm_charts | selectattr('chart_name', 'equalto', 'kubelet-csr-approver') | list | length > 0
    - helm_charts | selectattr('chart_name', 'equalto', 'kubelet-csr-approver') | selectattr('state', 'equalto', 'present') | list | length > 0
    - node_hostname not in (kubernetes_retired_nodes | default([]) | map(attribute='hostname') | list)
