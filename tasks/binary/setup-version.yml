---

- name: Fetch latest stable Kubernetes version
  when: kubernetes_release_type == 'latest'
  delegate_to: localhost
  become: false
  block:
    - name: Query latest stable Kubernetes version
      ansible.builtin.uri:
        url: "{{ kubernetes_release_upstream_url }}"
        return_content: yes
        validate_certs: no
        timeout: 15
      register: stable_version
      retries: 5
      delay: 5
      until: stable_version is succeeded

    - name: Set release to latest stable version
      ansible.builtin.set_fact:
        kubernetes_release_version: "{{ stable_version.content | trim }}"
      when: stable_version is succeeded
