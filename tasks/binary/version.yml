---

- name: Fetch latest Kubernetes version
  when: kubernetes_cluster_config_kubernetes_version == 'latest'
  delegate_to: localhost
  become: false
  block:
    - name: Query Kubernetes version from GitHub
      ansible.builtin.uri:
        url: "{{ kubernetes_release_upstream_url }}"
        return_content: yes
        validate_certs: no
        timeout: 15
      register: github_version
      retries: "{{ kubernetes_kubeadm_retry }}"
      delay: "{{ kubernetes_kubeadm_delay }}"
      until: github_version is succeeded

    - name: Set release version from GitHub
      ansible.builtin.set_fact:
        kubernetes_release_version: "{{ github_version.json.tag_name }}"
        kubernetes_cluster_config_kubernetes_version: "{{ github_version.json.tag_name | regex_replace('^v', '') }}"
      when: github_version is succeeded
