---

- name: Upload certificates
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: certificate_key

- name: Get join command for nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubeadm token create --print-join-command
  register: join_command

- name: Save join command and certificate key for nodes
  ansible.builtin.set_fact:
    cluster_init_cert_key: "{{ certificate_key.stdout_lines[-1] }}"
    cluster_init_join_command: "{{ join_command.stdout }}"

- name: Save join command for master and worker nodes
  ansible.builtin.set_fact:
    master_join_command: "{{ cluster_init_join_command }} --certificate-key {{ cluster_init_cert_key }} --control-plane"
    worker_join_command: "{{ cluster_init_join_command }} --certificate-key {{ cluster_init_cert_key }}"

- name: Ensure tmp directory exists in playbook_dir
  ansible.builtin.file:
    path: "{{ playbook_dir }}/tmp"
    state: directory
    mode: '0755'
  delegate_to: localhost
  run_once: true
  become: false

- name: Save join commands to files in tmp folder
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ playbook_dir }}/tmp/{{ item.filename }}"
    mode: '0600'
  delegate_to: localhost
  run_once: true
  become: false
  loop:
    - { content: "{{ master_join_command }}", filename: "{{ kubernetes_join_command_file_master }}" }
    - { content: "{{ worker_join_command }}", filename: "{{ kubernetes_join_command_file_worker }}" }
    - { content: "{{ cluster_init_cert_key }}", filename: "{{ kubernetes_join_command_file_cert_key }}" }
