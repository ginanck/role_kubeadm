---

# gateway-api deployment example
# https://gateway-api.sigs.k8s.io/guides/#install-standard-channel

# kubernetes_traffic_type: gateway-api
# kubernetes_traffic_deployment_type: standard
# kubernetes_traffic_deployment_version: v1.3.0

- name: install gateway-api deployment
  ansible.builtin.command: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ kubernetes_traffic_deployment_version }}/standard-install.yaml

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: metric_server
  changed_when: metric_server.rc == 0
