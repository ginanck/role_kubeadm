---

- name: join other master nodes to Kubernetes cluster
  ansible.builtin.command: "{{ master_node_join_command }}"
  throttle: 1
  when: 
    - inventory_hostname in groups['k8s_master']
    - inventory_hostname != init_master_node
    - master_node_join_command is defined
  register: join_result

- name: join worker nodes to Kubernetes cluster
  ansible.builtin.command: "{{ worker_node_join_command }}"
  throttle: 1
  when: 
    - inventory_hostname in groups['k8s_worker']
    - worker_node_join_command is defined
  register: join_result

- name: display node join command
  ansible.builtin.debug:
    msg: "Join command: {{ join_result.stdout_lines }}"
  when: join_result is defined and join_result.stdout_lines is defined

- name: display node join command output
  ansible.builtin.debug:
    var: join_result.stdout_lines
  when: join_result is defined and join_result.stdout_lines is defined
