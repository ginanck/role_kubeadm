  retries: 30
  delay: 10
  changed_when: false
  failed_when: 
    - apiserver_status.stdout != "Running"
    - apiserver_status.attempts >= 30
  run_once: true
  delegate_to: "{{ init_master_node }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: check controller-manager pod health
  ansible.builtin.shell: "kubectl get pods -n kube-system | grep 'kube-controller-manager-' | awk '{print $3}'"
  register: controller_status
  until: controller_status.stdout == "Running"
  retries: 30
  delay: 10
  changed_when: false
  failed_when: 
    - controller_status.stdout != "Running"
    - controller_status.attempts >= 30
  run_once: true
  delegate_to: "{{ init_master_node }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: check scheduler pod health
  ansible.builtin.shell: "kubectl get pods -n kube-system | grep 'kube-scheduler-' | awk '{print $3}'"
  register: scheduler_status
  until: scheduler_status.stdout == "Running"
  retries: 30
  delay: 10
  changed_when: false
  failed_when: 
    - scheduler_status.stdout != "Running"
    - scheduler_status.attempts >= 30
  run_once: true
  delegate_to: "{{ init_master_node }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
