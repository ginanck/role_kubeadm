---

- name: drain init master node
  ansible.builtin.command: >
    kubectl drain {{ node_hostname.stdout }} 
    --ignore-daemonsets 
    --delete-emptydir-data 
    --force 
    --timeout={{ kubernetes_kubeadm_upgrade_drain_timeout }}
  register: drain_init_master_result

- name: pull required container images
  ansible.builtin.include_tasks: kubeadm/pull.yml

- name: save image list
  ansible.builtin.include_tasks: kubeadm/image.yml

- name: handle CoreDNS upgrade requirements
  ansible.builtin.include_tasks: kubeadm/upgrade/coredns_handler.yml

- name: display upgrade plan
  ansible.builtin.debug:
    var: upgrade_plan_result.stdout_lines

- name: apply kubeadm upgrade on init master
  ansible.builtin.command: >
    kubeadm upgrade apply v{{ kubernetes_cluster_config_kubernetes_version }} --yes {% if ignore_coredns_errors %}--ignore-preflight-errors=CreateJob,CoreDNSUnsupportedPlugins,CoreDNSMigration{% else %}--ignore-preflight-errors=CreateJob{% endif %}
    {% if kubernetes_release_allow_prerelease %}--allow-experimental-upgrades --allow-release-candidate-upgrades --force{% endif %}
  register: upgrade_apply_result

- name: display upgrade apply result
  ansible.builtin.debug:
    var: upgrade_apply_result.stdout_lines

- name: restart kubelet service on init master
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    enabled: true
    daemon_reload: true

- name: uncordon init master node
  ansible.builtin.command: kubectl uncordon {{ node_hostname.stdout }}
