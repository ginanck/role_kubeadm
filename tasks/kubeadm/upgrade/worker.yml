---

- name: Upgrade worker nodes
  throttle: 1  # Upgrade one node at a time
  block:
    - name: Drain worker node
      ansible.builtin.command: >
        kubectl drain {{ node_hostname }} 
        --ignore-daemonsets 
        --delete-emptydir-data 
        --force 
        --timeout={{ kubernetes_kubeadm_upgrade_drain_timeout }}
        --skip-wait-for-delete-timeout=60
      delegate_to: "{{ init_master_node }}"
      register: drain_worker_result
      retries: "{{ kubernetes_kubeadm_retry }}"
      delay: "{{ kubernetes_kubeadm_delay }}"
      until: drain_worker_result.rc == 0

    - name: Upgrade worker node configuration
      ansible.builtin.command: >
        kubeadm upgrade node
      register: upgrade_worker_result

    - name: Display upgrade node result for worker
      ansible.builtin.debug:
        var: upgrade_worker_result.stdout_lines

    - name: Restart kubelet service on worker
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Uncordon worker node
      ansible.builtin.command: kubectl uncordon {{ node_hostname }}
      delegate_to: "{{ init_master_node }}"
      register: uncordon_worker_result

    - name: Wait for worker to be fully ready
      ansible.builtin.command: kubectl get nodes {{ node_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ init_master_node }}"
      register: worker_status
      retries: "{{ kubernetes_kubeadm_retry }}"
      delay: "{{ kubernetes_kubeadm_delay }}"
      until: true
      changed_when: false
