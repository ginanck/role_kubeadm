---
# defaults file for role_k8s
# k8s_releases:
# for all version history: https://kubernetes.io/releases/
# for all releases from GitHub: https://github.com/kubernetes/kubernetes/releases
# for last 3 stable versions: https://www.downloadkubernetes.com
# k8s_templates: https://github.com/kubernetes/release/tree/master/cmd/krel/templates/latest

# kubernetes skew policy: https://kubernetes.io/releases/version-skew-policy/
# version skew policy: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/#version-skew-policy

kubernetes_kubeadm_delay: 30
kubernetes_kubeadm_retry: 30
kubernetes_kubeadm_upgrade_drain_timeout: "600s"

kubernetes_cluster_init_config_path: /tmp
kubernetes_cluster_init_config_local_advertise_address: 172.16.3.101
kubernetes_cluster_init_config_local_advertise_port: 6443

# This is the endpoint of the control plane node when using External Loadbalacer for Multi Master Setup
# By default, it is the same as the local advertise address and port for Single Master Setup
kubernetes_cluster_config_control_plane_endpoint_url: 172.16.3.101
kubernetes_cluster_config_control_plane_endpoint_port: 6443

kubernetes_cluster_config_kubernetes_version: 1.30.13
kubernetes_cluster_config_cluster_name: kubernetes
kubernetes_cluster_config_networking_service_subnet: "10.96.0.0/12"
kubernetes_cluster_config_networking_pod_subnet: "10.244.0.0/16"
kubernetes_cluster_config_networking_dns_domain: cluster.local

kubernetes_cluster_config_api_server_extra_args:
  - Node
  - RBAC

kubernetes_cluster_config_api_server_timeout_for_controlplane_seconds: "4m0s"
kubernetes_cluster_config_controller_manager_extra_args:
  bind-address: "0.0.0.0"
  node-monitor-period: "5s"
  node-monitor-grace-period: "15s"
  secure-port: "10257"

kubernetes_cluster_config_scheduler_extra_args:
  bind-address: "0.0.0.0"
  secure-port: "10259"

kubernetes_cluster_config_etcd_local:
  dataDir: "/var/lib/etcd"

kubernetes_cluster_proxy_mode: ipvs
kubernetes_cluster_proxy_ipvs_strict_arp: true

kubernetes_cluster_pod_network_type: calico

kubernetes_calico_version: v3.30.0
kubernetes_calico_deployment_type: medium                     # "medium" for less than 50 nodes, "large" for more than 50 nodes

kubernetes_metric_server_version: v0.7.2
kubernetes_metric_server_deployment_type: high-availability   # "high-availability" for deploying metric server in high-availability mode, "single" for deploying in single node mode

kubernetes_traffic_type: gateway-api              # Traffic Type: "gateway-api" or "ingress-nginx" is the traffic type
kubernetes_traffic_deployment_type: standard      # Deployment Type: "standard", "minimal", "complete" etc etc.
kubernetes_traffic_deployment_version: v1.3.0

kubernetes_traffic_deployment_resource: nginx-gateway-fabric
kubernetes_traffic_deployment_resource_version: v1.6.2

kubernetes_kubelet_config_path: /var/lib/kubelet
kubernetes_kubelet_authentication_anonymous_enabled: false
kubernetes_kubelet_authentication_webhook_cacheTTL: "0s"
kubernetes_kubelet_authentication_webhook_enabled: true
kubernetes_kubelet_authentication_x509_clientCAFile: "/etc/kubernetes/pki/ca.crt"
kubernetes_kubelet_authorization_mode: "Webhook"
kubernetes_kubelet_authorization_webhook_cacheAuthorizedTTL: "0s"
kubernetes_kubelet_authorization_webhook_cacheUnauthorizedTTL: "0s"
kubernetes_kubelet_cgroupDriver: "systemd"
kubernetes_kubelet_clusterDNS: "10.96.0.10"
kubernetes_kubelet_clusterDomain: "{{ kubernetes_cluster_config_networking_dns_domain }}"
kubernetes_kubelet_containerRuntimeEndpoint: "/run/containerd/containerd.sock"
kubernetes_kubelet_cpuManagerReconcilePeriod: "0s"
kubernetes_kubelet_evictionPressureTransitionPeriod: "0s"
kubernetes_kubelet_failSwapOn: false
kubernetes_kubelet_fileCheckFrequency: "0s"
kubernetes_kubelet_healthzBindAddress: "127.0.0.1"
kubernetes_kubelet_healthzPort: "10248"
kubernetes_kubelet_httpCheckFrequency: "0s"
kubernetes_kubelet_imageMaximumGCAge: "0s"
kubernetes_kubelet_imageMinimumGCAge: "0s"
kubernetes_kubelet_logging_flushFrequency: 0
kubernetes_kubelet_logging_options_json_infoBufferSize: 0
kubernetes_kubelet_logging_options_text_infoBufferSize: 0
kubernetes_kubelet_logging_verbosity: 0
kubernetes_kubelet_nodeStatusReportFrequency: "0s"
kubernetes_kubelet_nodeStatusUpdateFrequency: "0s"
kubernetes_kubelet_rotateCertificates: true
kubernetes_kubelet_runtimeRequestTimeout: "0s"
kubernetes_kubelet_serverTLSBootstrap: true
kubernetes_kubelet_shutdownGracePeriod: "0s"
kubernetes_kubelet_shutdownGracePeriodCriticalPods: "0s"
kubernetes_kubelet_staticPodPath: "/etc/kubernetes/manifests"
kubernetes_kubelet_streamingConnectionIdleTimeout: "0s"
kubernetes_kubelet_syncFrequency: "0s"
kubernetes_kubelet_volumeStatsAggPeriod: "0s"

kubernetes_sysctl_conf_file: "99-kubernetes.conf"
kubernetes_sysctl_parameters:
  - name: net.ipv4.ip_forward
    value: 1
  - name: vm.swappiness
    value: 0
  # Additional safe sysctls supported by Kubernetes
  - name: net.ipv4.ip_local_reserved_ports
    value: "30000-32767"  # Example: reserve ports for NodePort range
  - name: net.ipv4.tcp_keepalive_time
    value: 600            # Example: 10 minutes
  - name: net.ipv4.tcp_fin_timeout
    value: 20             # Example: 20 seconds
  - name: net.ipv4.tcp_keepalive_intvl
    value: 30             # Example: 30 seconds
  - name: net.ipv4.tcp_keepalive_probes
    value: 5              # Example: 5 probes
  - name: net.ipv4.tcp_syncookies
    value: 1              # Enable SYN cookies

kubernetes_binary_dir: /opt/k8s/bin
kubernetes_binary_link_path: /usr/bin
kubernetes_systemd_path: /etc/systemd/system

kubernetes_release_version: "v{{ kubernetes_cluster_config_kubernetes_version }}"    # Stable kubernetes version to install, please check the latest version from "k8s_releases" section above
kubernetes_release_arch: amd64

kubernetes_release_type: stable         # "stable" or "latest" for k8s versions
kubernetes_release_base_url: https://dl.k8s.io
kubernetes_release_download_url: "{{ kubernetes_release_base_url }}/{{ kubernetes_release_version }}/bin/linux/{{ kubernetes_release_arch }}"
kubernetes_release_upstream_url: "{{ kubernetes_release_base_url }}/{{ kubernetes_release_type }}.txt"
